server {
    listen 80;
    server_name _;

    # Subidas de carpetas .md / zip del bot
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas a /api van al backend Node (mismo namespace).
    # Sin barra final en proxy_pass: se conserva el prefijo /api,
    # que es lo que espera Express (app.use('/api/...')).
    location /api/ {
        proxy_pass http://codeatlas-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA (Vue Router en modo history): cualquier ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
